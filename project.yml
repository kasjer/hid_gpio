project.name: "hid_gpio"

project.repositories:
    - apache-mynewt-core

# Use github's distribution mechanism for core ASF libraries.
# This provides mirroring automatically for us.
#
repository.apache-mynewt-core:
    type: github
    vers: 9e0766d467322e11a5b5d34fbc51d2a5b5852c1c-commit
    branch: master
    user: apache
    repo: mynewt-core

project.repositories.allowed:
    - apache-mynewt-core
    - mcuboot
    - mbedtls
    - stm-cmsis_device_f1
    - stm-cmsis_device_f4
    - stm-cmsis_device_h5
    - stm-stm32f1xx_hal_driver
    - stm-stm32f4xx_hal_driver
    - stm-stm32h5xx_hal_driver
