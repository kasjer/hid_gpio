syscfg.vals:
    MYNEWT_DOWNLOADER: stm32_programmer_cli

    SHELL: 0

    # hal_system_reset() executes bkpt when debugger is attached (C_DEBUGEN stays
    # set until power cycle), that would halt DFU detach reboot with J-Link connected.
    HAL_ENABLE_SOFTWARE_BREAKPOINTS: 0

    # NVReg on F1 is 16 bits, write bootloader USBD_DFU_RESET_COUNT value.
    # Must match USBD_DFU_RESET_COUNT in targets/bluepill-boot_dfu/syscfg.yml
    USBD_DFU_RUNTIME: 1
    USBD_DFU_MAGIC_NVREG: 2
    USBD_DFU_MAGIC_VALUE: 4
    USBD_WINDOWS_COMP_ID: 1
    USBD_WINDOWS_COMP_INTERFACE: 1
    USBD_DFU_SLOT_NAME: '"MYNEWT@08008000*92K"'

    # example GPIO for ease start
#    HID_GPIO_PIN0: LED_BLINK_PIN

    HID_GPIO_PIN0: MCU_GPIO_PORTB(12)
    HID_GPIO_PIN1: MCU_GPIO_PORTB(13)
    HID_GPIO_PIN2: MCU_GPIO_PORTB(14)
    HID_GPIO_PIN3: MCU_GPIO_PORTB(15)
    HID_GPIO_PIN4: MCU_GPIO_PORTA(8)
    HID_GPIO_PIN5: MCU_GPIO_PORTA(9)
    HID_GPIO_PIN6: MCU_GPIO_PORTA(10)
    HID_GPIO_PIN7: MCU_GPIO_PORTB(3)
